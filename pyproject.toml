[project]
name = "job-hunt-engine"
version = "2.0.0"
description = "Semi-automated executive job search engine (data/AI + wellness lanes)"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.45",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "resend>=2.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
gmail = [
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["engine", "engine.aggregator", "engine.matcher", "engine.tailor",
            "engine.submitter", "engine.tracker", "engine.notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
